[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ankan"
version = "0.1.0"
description = "Handwritten answer sheet auto-grading with a teacher in the loop"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prabhutva Gupta" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.5",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
trocr = ["torch>=2.1", "transformers>=4.40", "pillow>=10"]
paddle = ["paddleocr>=2.7", "paddlepaddle>=2.6"]
embeddings = ["sentence-transformers>=2.6"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]
all = [
    "ankan[trocr,embeddings,llm]",
]

[project.scripts]
ankan = "ankan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ankan = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL"]
# PLC0415: heavy backends are imported inside functions on purpose (lazy loading).
# SIM905: a whitespace-separated word list is easier to maintain than a list literal.
ignore = ["PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLC0415", "SIM905"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "torch", "torch.*", "transformers", "transformers.*", "PIL", "PIL.*", "paddleocr", "paddleocr.*", "sentence_transformers", "sentence_transformers.*", "anthropic", "anthropic.*", "uvicorn"]
ignore_missing_imports = true
